<!DOCTYPE html>
<html>
<head>
  <title>MCC Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }

    th {
      color: #94a3b8;
    }
  </style>
</head>
<body>

<h1>MCC Live Dashboard</h1>

<div class="card">
  <h3>Total Events: <span id="totalEvents">0</span></h3>
</div>

<div class="card">
  <h3>Recent Activity</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Sub Account</th>
        <th>Debt</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
async function loadData() {
  const res = await fetch('/api/ghl');
  const data = await res.json();

  document.getElementById('totalEvents').innerText = data.totalEvents;

  const table = document.getElementById('tableBody');
  table.innerHTML = '';

  data.recentContacts.forEach(c => {
    const row = `
      <tr>
        <td>${c.name}</td>
        <td>${c.phone}</td>
        <td>${c.email}</td>
        <td>${c.subAccount}</td>
        <td>${c.debtAmount}</td>
      </tr>
    `;
    table.innerHTML += row;
  });
}

setInterval(loadData, 2000);
loadData();
</script>

</body>
</html>
