<!DOCTYPE html>
<html>
<head>
  <title>MCC Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 { color: #4da3ff; }
    .card {
      background: #111827;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>

<h1>MCC Live Dashboard</h1>

<div class="card">
  Agents Online: <span id="agents">Loading...</span>
</div>

<div class="card">
  Calls Active: <span id="calls">Loading...</span>
</div>

<div class="card">
  Leads in Queue: <span id="leads">Loading...</span>
</div>

<script>
async function loadData() {
  try {
    const res = await fetch('/api/data');
    const data = await res.json();

    document.getElementById('agents').innerText = data.agents;
    document.getElementById('calls').innerText = data.calls;
    document.getElementById('leads').innerText = data.leads;
  } catch (e) {
    console.log(e);
  }
}

setInterval(loadData, 5000);
loadData();
</script>

</body>
</html>
